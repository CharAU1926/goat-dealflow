<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>Offline | Khora Flow</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#020617;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:380px;text-align:center}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#34d399;box-shadow:0 0 14px rgba(52,211,153,.8)}
    h1{margin:20px 0 8px;font-size:22px;color:#fff}
    p{margin:0;color:#94a3b8;font-size:14px;line-height:1.6}
    button{margin-top:24px;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.1);color:#a7f3d0;font-size:14px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <span class="dot"></span>
    <h1>You're offline</h1>
    <p>Khora Flow needs a connection to show deals, pipelines and messages. For your privacy, private data is never stored on this device. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
